<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Institute API | Demetrius Edwards</title>

    <script
      src="https://kit.fontawesome.com/83068f7933.js"

    <link rel="stylesheet" href="css/api.css" />
